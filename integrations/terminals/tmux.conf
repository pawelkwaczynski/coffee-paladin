# coffee-paladin in the tmux status bar.
#
# Append to ~/.tmux.conf (or source this file). tmux strips ANSI colors from
# #() output, so the line runs with NO_COLOR and ascii icons - a row of tofu
# in the status bar helps nobody. stdin is closed explicitly: the statusline
# script reads stdin when it is not a tty, and tmux would leave it waiting.
set -g status-interval 15
set -ag status-right ' #(NO_COLOR=1 COFFEE_PALADIN_STATUSLINE_ICONS=ascii ~/.coffee-paladin/statusline.sh </dev/null | head -1) '
